name: Update Orchard Last Working Backup

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.orchard-backup'
      - '.github/workflows/backup.yml'

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read confirmed stable commit
        id: stable
        shell: bash
        run: |
          set -euo pipefail
          target="$(sed -n 's/^LAST_WORKING_COMMIT=//p' .orchard-backup | tail -n1)"
          if [[ -z "$target" ]]; then
            echo "LAST_WORKING_COMMIT is missing." >&2
            exit 1
          fi

          git fetch --all --tags --prune
          git cat-file -e "${target}^{commit}"

          echo "target=$target" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$target" > LAST_WORKING_COMMIT.txt

      - name: Create stable source archive
        env:
          TARGET: ${{ steps.stable.outputs.target }}
        run: |
          set -euo pipefail
          git archive --format=tar.gz \
            --output=orchard-last-working-source.tar.gz \
            "$TARGET"

          sha256sum orchard-last-working-source.tar.gz \
            > orchard-last-working-source.tar.gz.sha256

      - name: Upload last working backup
        uses: actions/upload-artifact@v7
        with:
          name: orchard-last-working-source
          path: |
            orchard-last-working-source.tar.gz
            orchard-last-working-source.tar.gz.sha256
            LAST_WORKING_COMMIT.txt
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
